<!DOCTYPE html>
<html>
<head>
    <title>Average Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 15px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; font-size: 16px; }
        input { border: 2px solid #ddd; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; font-weight: bold; cursor: pointer; }
        .result { margin-top: 20px; padding: 20px; background: #f8f9ff; border-radius: 8px; }
        .average-value { font-size: 36px; font-weight: bold; color: #667eea; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Average Calculator</h1>
        <input type="text" id="numbers" placeholder="Enter numbers: 10, 20, 30">
        <button onclick="calculate()">Calculate Average</button>
        <div class="result" id="result">
            <div class="average-value" id="average">0.00</div>
            <div id="details"></div>
        </div>
    </div>

    <script>
        function calculate() {
            const input = document.getElementById('numbers').value.trim();
            const averageSpan = document.getElementById('average');
            const detailsDiv = document.getElementById('details');
            
            if (!input) {
                alert('Please enter numbers');
                return;
            }
            
            const numbers = input.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
            
            if (numbers.length === 0) {
                detailsDiv.innerHTML = '<p style="color:red">No valid numbers</p>';
                return;
            }
            
            const sum = numbers.reduce((a, b) => a + b, 0);
            const average = sum / numbers.length;
            
            averageSpan.textContent = average.toFixed(2);
            detailsDiv.innerHTML = `
                <p><strong>Count:</strong> ${numbers.length} numbers</p>
                <p><strong>Sum:</strong> ${sum.toFixed(2)}</p>
                <p><strong>Numbers:</strong> ${numbers.join(', ')}</p>
            `;
        }
    </script>
</body>
</html>
